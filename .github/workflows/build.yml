name: Build Windows EXE
on: 
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build Standalone Windows EXE
        shell: cmd
        run: |
          javac -encoding UTF-8 GhostEvaluator.java
          jar cfe PHANT29M.jar GhostEvaluator *.class
          jpackage --input . --name "PHANT29M" --main-jar PHANT29M.jar --main-class GhostEvaluator --type app-image --win-console false

      - name: Upload Finished EXE
        uses: actions/upload-artifact@v4
        with:
          name: PHANT29M-Windows-Ready
          path: PHANT29M/
