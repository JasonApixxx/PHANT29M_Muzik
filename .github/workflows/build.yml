name: Build Windows EXE
on: 
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Compile JAR with Maven
        run: mvn clean package -DskipTests

      - name: Build Standalone EXE with jpackage
        shell: cmd
        run: |
          mkdir out
          jpackage --input target --name "PHANT29M" --main-jar PHANT29M-1.0.jar --main-class GhostEvaluator --type app-image --dest out --win-console false

      - name: Upload Only Ready EXE Folder
        uses: actions/upload-artifact@v4
        with:
          name: PHANT29M-Windows-Ready
          path: out/PHANT29M/
